<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Calculadora</title>
    <link rel="stylesheet" href="styles.css">
    <script src="log.js" defer></script>
</head>
<body>
    <main class="pagina">
        <header class="encabezado">
            <p class="etiqueta">EJERCICIO 3</p>
            <h1>Calculadora</h1>
            <p class="introduccion">Elige una operación y calcula el resultado de dos números.</p>
        </header>

        <div class="contenido">
            <section class="tarjeta practica" aria-labelledby="titulo-calculadora">
                <h2 id="titulo-calculadora">Realiza una operación</h2>
                <p class="ayuda">Escribe los números y selecciona el operador.</p>
                <form id="formulario-calculadora">
                    <label for="numero-a">Primer número</label>
                    <input id="numero-a" name="numero-a" type="number" step="any" placeholder="Por ejemplo, 12" required>

                    <label for="operador">Operador</label>
                    <select id="operador" name="operador">
                        <option value="+">Suma (+)</option>
                        <option value="-">Resta (−)</option>
                        <option value="*">Multiplicación (×)</option>
                        <option value="/">División (÷)</option>
                    </select>

                    <label for="numero-b">Segundo número</label>
                    <input id="numero-b" name="numero-b" type="number" step="any" placeholder="Por ejemplo, 3" required>

                    <button type="submit">Calcular</button>
                </form>
                <p id="mensaje" class="resultado" aria-live="polite"></p>
            </section>

            <section class="tarjeta resultado-tarjeta" aria-labelledby="titulo-resultado">
                <h2 id="titulo-resultado">Tu resultado</h2>
                <p id="resultado" class="valor-resultado" aria-live="polite">Aquí aparecerá el resultado.</p>
            </section>
        </div>
    </main>
</body>
</html>
